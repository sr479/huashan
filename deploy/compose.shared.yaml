# 与已有业务共用服务器时，只启动 app，沿用宿主机现有的 HTTPS 反向代理。
# docker compose -f compose.yaml -f deploy/compose.shared.yaml up -d --build --wait app
services:
  app:
    cpus: '0.75'
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '127.0.0.1:${APP_BIND_PORT:-3300}:3000'
