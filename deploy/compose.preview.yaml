# 独立的临时测试环境；不得与正式业务共用数据卷或管理密码。
name: huashanjie-preview

services:
  app:
    image: huashanjie:${APP_IMAGE_TAG:-v1.0.1}
    restart: unless-stopped
    cpus: '0.5'
    mem_limit: 384m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${PREVIEW_ORIGIN:?请设置带 HTTPS 和端口的测试访问地址}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请为测试后台单独生成随机密码}
      DATABASE_PATH: /app/data/huashanjie.sqlite
      UPLOAD_DIR: /app/data/uploads
      SEED_DEMO: 'true'
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:${APP_BIND_PORT:-3400}:3000'
    volumes:
      - preview_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  preview_data:
