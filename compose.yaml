services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: https://${DOMAIN:-huashanjie.top}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在.env中设置至少12位的管理密码}
      DATABASE_PATH: /app/data/huashanjie.sqlite
      UPLOAD_DIR: /app/data/uploads
      SEED_DEMO: 'false'
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
    volumes:
      - store_data:/app/data
    expose:
      - '3000'
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-huashanjie.top}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  store_data:
  caddy_data:
  caddy_config:
